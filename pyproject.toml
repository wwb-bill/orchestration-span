[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration-span"
version = "0.1.0"
description = "Observability spans for agent orchestration phases — planning/reasoning/safety/delegation/memory, reasoning-loop detection, blind-spot phases. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wwb-bill" }]
keywords = ["observability", "orchestration", "span", "agent", "fault-detection", "telemetry"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orchestration-span = "orchestration_span.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
